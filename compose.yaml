name: huellacerca

services:
  huellacerca_db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Definir POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Definir POSTGRES_DB en .env}
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - huellacerca_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  huellacerca_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      huellacerca_db:
        condition: service_healthy
      huellacerca_migrations:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Jwt__Key: ${JWT_KEY:?Definir JWT_KEY en .env}
      Jwt__Issuer: HuellaCercaApi
      Jwt__Audience: HuellaCercaMobile
      Jwt__AccessMinutes: "15"
      Jwt__RefreshDays: "30"
      Brevo__Enabled: ${BREVO_ENABLED:-false}
      Brevo__BaseUrl: ${BREVO_BASE_URL:-https://api.brevo.com/v3/}
      Brevo__SenderEmail: ${BREVO_SENDER_EMAIL:-no-reply@huellacerca.online}
      Brevo__SenderName: ${BREVO_SENDER_NAME:-Huella Cerca}
      Brevo__ApiKey: ${BREVO_API_KEY:-}
      R2__Enabled: ${R2_ENABLED:-false}
      R2__Endpoint: ${R2_ENDPOINT:-}
      R2__Bucket: ${R2_BUCKET:-}
      R2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      FirebasePush__Enabled: ${FIREBASE_PUSH_ENABLED:-false}
      FirebasePush__ProjectId: ${FIREBASE_PROJECT_ID:-huella-cerca}
      FirebasePush__CredentialsPath: /run/huellacerca-secrets/firebase-admin.json
      ConnectionStrings__DefaultConnection: "Host=huellacerca_db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-5080}:8080"
    volumes:
      - ./secrets:/run/huellacerca-secrets:ro

  huellacerca_migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: importer
    depends_on:
      huellacerca_db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=huellacerca_db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    command: ["--migrate-only"]
    restart: "no"

  huellacerca_importer:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: importer
    depends_on:
      huellacerca_migrations:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: "Host=huellacerca_db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    restart: "no"

  huellacerca_tools:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: tools
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - huellacerca_nuget:/root/.nuget/packages
    environment:
      HUELLACERCA_BUILD_ROOT: /tmp/huellacerca-build
      ConnectionStrings__DefaultConnection: "Host=huellacerca_db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    entrypoint: ["dotnet"]

  huellacerca_tests:
    profiles: ["tools"]
    image: python:3.12-slim
    volumes:
      - ./scripts:/tests:ro
    environment:
      API_BASE_URL: http://huellacerca_api:8080
      JWT_TEST_KEY: ${JWT_KEY}
    command: ["python", "/tests/test_ubicacion.py"]

volumes:
  huellacerca_nuget:
  huellacerca_db_data:
